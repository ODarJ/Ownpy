name: Test Scrape

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel username (empty = first channel in channels.txt)"
        required: false
        default: ""
      limit:
        description: "Max new posts to save"
        required: false
        default: "20"
      write_to_turso:
        description: "true = write to the real Turso database (default: local test_output only)"
        required: false
        default: "false"
  push:
    branches: [main]

permissions:
  contents: read    # nothing is committed back

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Cache the translation model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-windyword-en-sit-v1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pick channel
        id: pick
        env:
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
          CHANNELS_KEY: ${{ secrets.CHANNELS_KEY }}
          HIDE_CHANNELS: ${{ vars.HIDE_CHANNELS }}
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, ".")
          from channels_crypto import ChannelsFileError, clean_channel, read_channels

          ch = clean_channel(os.environ.get("INPUT_CHANNEL", ""))
          if not ch:
              try:
                  names = read_channels("channels.txt")      # plain or encrypted
              except ChannelsFileError as e:
                  sys.exit("channels.txt: " + str(e))
              if not names:
                  sys.exit("channels.txt is empty")
              ch = names[0]
          hide = os.environ.get("HIDE_CHANNELS") == "true"
          if hide:
              print("::add-mask::" + ch)
          else:
              print("Testing channel:", ch)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("channel=" + ch + "\n")
          PY

      - name: Run scraper
        env:
          TARGET_CHANNEL: ${{ steps.pick.outputs.channel }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          # a test run must not touch the real database unless you ask for it
          TURSO_DATABASE_URL: ${{ github.event.inputs.write_to_turso == 'true' && secrets.TURSO_DATABASE_URL || '' }}
          TURSO_AUTH_TOKEN: ${{ github.event.inputs.write_to_turso == 'true' && secrets.TURSO_AUTH_TOKEN || '' }}
          TARGET_LIMIT: ${{ github.event.inputs.limit || '20' }}
          JSON_DIR: test_output          # fresh folder, ignores committed state, never committed
          MAX_RUNTIME_MIN: "50"
          CHANNEL_BUDGET_MIN: "0"
        run: python scraper.py

      - name: Print output.json
        if: always()
        run: |
          echo "===== output.json ====="
          F="test_output/${{ steps.pick.outputs.channel }}/output.json"
          if [ -f "$F" ]; then cat "$F"; else echo "no output.json (the movies went to Turso, or nothing was found)"; fi

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test_output/
          if-no-files-found: warn
