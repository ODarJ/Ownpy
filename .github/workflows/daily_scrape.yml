name: Daily Scrape

on:
  schedule:
    - cron: "0 0 * * *"   # every day at 00:00 UTC
  workflow_dispatch:       # lets you also run it by hand

permissions:
  contents: write          # needed to push the commit

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Check TMDB key
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: test -n "$TMDB_API_KEY" || (echo "TMDB_API_KEY secret is missing" && exit 1)

      - name: Run scraper
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scraper.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in output.json state.json tmdb_cache.json review.json rejected.json nolinks_sample.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily scrape $(date -u +'%Y-%m-%d')"
            git push
          fi